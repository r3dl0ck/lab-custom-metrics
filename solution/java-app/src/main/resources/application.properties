spring.application.name=shop

# JSON w tym samym formacie co w aplikacji PHP (product_id, order_id)
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- Actuator + Micrometer ---
management.endpoints.web.exposure.include=health,prometheus
# bucketsy histogramu dla metryk HTTP (bucket 300ms = próg SLO)
management.metrics.distribution.slo.http.server.requests=50ms,100ms,300ms,500ms,1s,2500ms

# --- Etykiety statyczne dodawane do wszystkich metryk ---
management.metrics.tags.application=java-app
management.metrics.tags.env=lab
